<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabrielle Perfume</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="perfume">

            <div class="visual">
                <img src="images/image-product-desktop.jpg" alt="Gabrielle perfume">
            </div>

            <div class="details">

                <p class="type">P E R F U M E</p>

                <h1>Gabrielle Essence Eau De Parfum</h1>

                <p class="text">
                    A floral, solar and voluptuous interpretation composed by
                    Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>

                <div class="amount">
                    <span>$149.99</span>
                    <small>$169.99</small>
                </div>

                <button>
                    <img src="images/icon-cart.svg" alt="">
                    Add to Cart
                </button>

            </div>

        </div>

    </div>

</body>
</html>
